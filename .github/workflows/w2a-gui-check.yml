name: W2a GUI check (temporary)
on:
  push:
    branches: ['zygs1083-dotcom/windows-follow']
jobs:
  gui:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reuse unchanged packaged Swift brain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38797264615 --name windows-spike --dir artifacts
          Remove-Item artifacts/e2e*, artifacts/shell.*.log, artifacts/stub.*.log -Force -ErrorAction SilentlyContinue
          Remove-Item artifacts/shell/brain -Recurse -Force -ErrorAction SilentlyContinue
      - run: dotnet publish windows/LifeNarrator.Windows -c Release -r win-x64 --self-contained true -o artifacts/shell
      - run: windows/scripts/run-e2e.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shell-e2e
          path: |
            artifacts/e2e*
            artifacts/shell.*.log
            artifacts/stub.*.log
