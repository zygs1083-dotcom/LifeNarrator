name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-import-signing.sh
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
      - run: scripts/bundle.sh
        env:
          SIGN_IDENTITY: LifeNarrator Self-Signed
      - run: gh release create "$GITHUB_REF_NAME" dist/LifeNarrator.dmg dist/LifeNarrator.zip dist/checksums.txt dist/version.txt --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: swift build -c release --product narrator-brain
      - run: windows/scripts/package-brain.ps1
      - run: choco install innosetup --no-progress -y
      - run: windows/scripts/build-installer.ps1
      - run: gh release upload "$env:GITHUB_REF_NAME" artifacts/LifeNarrator-Setup.exe artifacts/checksums-windows.txt
        env:
          GH_TOKEN: ${{ github.token }}
