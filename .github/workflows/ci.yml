name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: if [ -d Tests/NarratorCoreTests ]; then swift test; fi

  macos:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
        env:
          SNAPSHOT_DIR: ${{ github.workspace }}/.build/snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-snapshots
          path: .build/snapshots
      - run: scripts/ci-import-signing.sh
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
      - run: scripts/bundle.sh
        env:
          SIGN_IDENTITY: LifeNarrator Self-Signed
      - uses: actions/upload-artifact@v4
        with:
          name: LifeNarrator-app
          path: |
            dist/LifeNarrator.zip
            dist/LifeNarrator.dmg
            dist/checksums.txt
          if-no-files-found: error
